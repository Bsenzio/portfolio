<section class="page-header-publications"">

    <div class="header-content">

        <img
            src="assets/images/avatar-publications.png"
            alt="Research Publications Avatar"
            class="header-avatar"
        >

        <div class="header-text">

            <h1>Research Publications</h1>

            <p>
                Journal Articles, Conference Papers,
                Theses and Patents
            </p>

        </div>

    </div>

</section>

<div class="results-background">

    <!-- SEARCH BAR -->

    <div class="search-container">

        <input
            type="text"
            id="searchInput"
            placeholder="Search title, author, keyword..."
        >

        <button id="searchButton">
            <i class="fas fa-search"></i>
            Search
        </button>

    </div>

    <!-- FILTERS -->

	<div class="filters">

		<select id="yearFilter">
			<option value="all">All Years</option>
		</select>

		<select id="typeFilter">

			<option value="all">All Types</option>

			<option value="Journal">Journal</option>
			<option value="Conference">Conference</option>
			<option value="Thesis">Thesis</option>
			<option value="Patent">Patent</option>

		</select>

		<select id="languageFilter">
			<option value="all">All Languages</option>
		</select>

		<select id="keywordFilter">
			
			<option value="all">All Keywords</option>
		</select>
		
		<div id="selectedKeywords"></div>
		
	</div>
    <!-- RESULTS -->

    <p id="resultCount"></p>

   

	<div class="carousel-wrapper">

		<button id="prevBtn" class="carousel-nav">
			❮
		</button>

		<div id="publicationsContainer" class="carousel-container">
		</div>

		<button id="nextBtn" class="carousel-nav">
			❯
		</button>

	</div>



</div>
