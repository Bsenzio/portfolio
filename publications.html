<body>

    <a href="index.html" class="nav-btn home-btn">

        <i class="fas fa-book"></i>

<section class="page-header-publications">

    <div class="header-content">

        <img
            src="assets/images/avatar-publications.png"
            alt="Research Publications Avatar"
            class="header-avatar"
        >

        <div class="header-text">

            <h1>Research Publications</h1>

            <p>
                Journal Articles, Conference Papers,
                Theses and Patents
            </p>

        </div>

    </div>

</section>

<div class="results-background">

	<!-- SEARCH BAR -->

	<div class="search-container">

		<input
			type="text"
			id="searchInput"
			placeholder="Search title, author, keyword..."
		>

		<button id="searchButton">
			<i class="fas fa-search"></i>
			Search
		</button>

		<!-- DOWNLOAD PDF -->
		<button
			id="downloadPublicationsBtn"
			class="download-publications-btn"
			type="button"
		>
			<i class="fas fa-file-pdf"></i>
			Download Publication List
		</button>

		<!-- DOWNLOAD JAPANESE CV -->
		<a
			href="assets/cv/業績リスト＿センシオサビノバルセラトブルーノ.docx"
			download="業績リスト＿センシオサビノバルセラトブルーノ.docx"
			class="download-japanese-btn"
		>
			<i class="fas fa-file-word"></i>
			業績リスト
		</a>

	</div>

	<!-- FILTERS -->

	<div class="filters">

		<select id="yearFilter">
			<option value="all">All Years</option>
		</select>

		<select id="typeFilter">
			<option value="all">All Types</option>
			<option value="Journal">Journal</option>
			<option value="Conference">Conference</option>
			<option value="Thesis">Thesis</option>
			<option value="Patent">Patent</option>
		</select>

		<select id="languageFilter">
			<option value="all">All Languages</option>
		</select>

		<select id="keywordFilter">
			<option value="all">All Keywords</option>
		</select>

		<div id="selectedKeywords"></div>

	</div>

	<!-- RESULTS COUNT -->

	<p id="resultCount"></p>

	<!-- PUBLICATIONS CAROUSEL -->

	<div class="carousel-wrapper">

		<button id="prevBtn" class="carousel-nav">
			❮
		</button>

		<div id="publicationsContainer" class="carousel-container">
		</div>

		<button id="nextBtn" class="carousel-nav">
			❯
		</button>

	</div>
<!-- CLOSE RESULTS BACKGROUND -->

</div>

    <p>
        Edge/AI · Game Development · XR · Robotics
    </p>

	<p>
		<script>document.write(new Date().getFullYear())</script>

	</p>

<script src="js/publications-pdf.js"></script>
