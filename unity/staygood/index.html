<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stay Good — Arcade Player</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050811;color:#a5f4f2;font:12px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#050811}progress{accent-color:#70e4df;width:180px}#fullscreen{position:absolute;right:6px;bottom:6px;border:1px solid #a5f4f255;border-radius:4px;background:#08111bcc;color:#a5f4f2;cursor:pointer;padding:4px 7px}#loading.error{padding:20px;white-space:pre-wrap;overflow:auto}
</style></head><body>
<canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Stay Good game"></canvas>
<div id="loading" role="status"><span id="message">Loading Stay Good…</span><progress id="progress" max="1" value="0"></progress></div>
<button id="fullscreen" type="button" aria-label="Full screen">⛶</button>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),message=document.getElementById('message');
function failure(error){loading.hidden=false;loading.style.display='grid';loading.classList.add('error');message.textContent='Unable to load Unity. '+String(error);document.getElementById('progress').hidden=true;}
const config={arguments:[],dataUrl:'Build/App.data.unityweb',frameworkUrl:'Build/App.framework.js.unityweb',codeUrl:'Build/App.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'Stay Good Commando',productVersion:'0.1',devicePixelRatio:1,matchWebGLToCanvasSize:true,showBanner:(text,type)=>{if(type==='error')failure(text);}};
const loader=document.createElement('script');loader.src='Build/App.loader.js';loader.onerror=()=>failure('Build/App.loader.js is missing.');
loader.onload=()=>createUnityInstance(canvas,config,value=>{document.getElementById('progress').value=value;message.textContent='Loading Stay Good… '+Math.round(value*100)+'%';}).then(instance=>{loading.style.display='none';canvas.focus({preventScroll:true});document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);}).catch(failure);
document.body.appendChild(loader);
canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
window.addEventListener('keydown',event=>{if(document.activeElement===canvas&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();},{capture:true,passive:false});
</script></body></html>
